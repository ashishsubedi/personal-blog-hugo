baseURL: https://asubedi.com.np/

defaultContentLanguage: en
locale: en-US
title: Ashish Subedi
theme: cupper-hugo-theme
enableGitInfo: true

generator: "Custom"

taxonomies:
  tag: tags

permalinks:
  post: /:filename/

imaging:
  jpeg:
    quality: 90

params:
  description: "Backend & AI Systems Engineer. LLM inference, reverse engineering, and production systems (mostly held together by caffeine and cache hits)."
  homeMetaContent: "Ashish Subedi: Backend & AI Systems Engineer. Deep dives on LLM inference, reverse engineering, and production systems."
  footer: "Built with Hugo & stubborn curiosity. :)"
  # For more date formats see https://gohugo.io/functions/format/
  dateFormat: Jan 2, 2006
  codePenUser: darkVapour
  katex: true
  hideHeaderLinks: true
  search: true
  showThemeSwitcher: true
  defaultDarkTheme: true
  moveFooterToHeader: true
  navTitleText: Ashish Subedi
  logoAlt: Ashish Subedi

  author:
    name: Ashish Subedi
    email: iamashishsubedi@gmail.com

menu:
  nav:
    - name: Home
      url: /
      weight: 1
    - name: Blog
      url: /blog/
      weight: 2
    - name: About
      url: /about/
      weight: 3
    - name: Dev Logs
      url: /dlog/
      weight: 5
    - name: RSS
      url: /index.xml
      weight: 6

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\['
              - '\]'
            - - '$$'
              - '$$'
          inline:
            - - '\('
              - '\)'
    parser:
      attribute: true
      autoHeadingID: true
    renderer:
      hardWraps: false
      unsafe: true
      xHTML: false
  highlight:
    codeFences: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: true
    style: monokai
    tabWidth: 4
  tableOfContents:
    endLevel: 6
    startLevel: 2
